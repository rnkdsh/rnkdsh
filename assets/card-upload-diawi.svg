  <g fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M100 110V68M83 85l17-17 17 17"/><path d="M75 102v12a6 6 0 0 0 6 6h38a6 6 0 0 0 6-6v-12"/></g>
