<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">ronakdoshi, minified: rnkdsh</title>
  <desc id="desc">A terminal runs "whoami | minify". The name ronakdoshi drops its vowels and becomes rnkdsh: same human, 40% fewer bytes. Then "cat about.txt" prints: Software Engineer, React, Next.js, React Native, Nest.js. Android roots, shipping since 2017, based in India.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="#30363d"/>
    </pattern>
    <radialGradient id="glow" cx="380" cy="200" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ddc84" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#61dafb" stop-opacity=".06"/>
      <stop offset="1" stop-color="#61dafb" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1200" height="450" rx="16"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: "Geist Mono", "JetBrains Mono", "Cascadia Code", "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
    .ui { font-size: 17px; fill: #7d8590; }
    .sh { font-size: 24px; fill: #e6edf3; }
    .dim { fill: #7d8590; }
    .dir { fill: #79c0ff; }
    .cmd { fill: #7ee787; }
    .file { text-decoration: underline; }
    .hi { fill: #79c0ff; }
    .droid { fill: #3ddc84; font-weight: 700; }
    .b { font-weight: 700; }
    .cap { font-size: 26px; font-style: italic; fill: #7d8590; }

    /* Resting frame (also what reduced-motion users see): consonants lit, vowels faded out. */
    .v { fill: #ff7b72; opacity: .3; }
    .c0 { fill: #3ddc84; }
    .c1 { fill: #44dc9c; }
    .c2 { fill: #4bdbb4; }
    .c3 { fill: #53dbcb; }
    .c4 { fill: #5adae3; }
    .c5 { fill: #61dafb; }
    .cap { opacity: 0; }

    @media (prefers-reduced-motion: no-preference) {
      .v, .c, .cap { animation-duration: 10s; animation-timing-function: cubic-bezier(.65, 0, .35, 1); animation-iteration-count: infinite; animation-fill-mode: both; }
      .v { animation-name: drop; }
      .v2 { animation-delay: .06s; }
      .v3 { animation-delay: .12s; }
      .v4 { animation-delay: .18s; }
      .c0 { animation-name: m0; }
      .c1 { animation-name: m1; }
      .c2 { animation-name: m2; }
      .c3 { animation-name: m3; }
      .c4 { animation-name: m4; }
      .c5 { animation-name: m5; }
      .cap { animation-name: cap; }
      .cur { animation: blink 1.1s step-end infinite; }
    }

    /* 10s loop: hold the full name, vowels turn red and fall away, consonants close ranks, hold, then rewind. */
    @keyframes drop {
      0%, 16% { transform: translateY(0); opacity: 1; fill: #e6edf3; }
      21% { transform: translateY(0); opacity: 1; fill: #ff7b72; animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
      28% { transform: translateY(34px); opacity: 0; fill: #ff7b72; }
      89% { transform: translateY(-28px); opacity: 0; fill: #e6edf3; }
      96%, 100% { transform: translateY(0); opacity: 1; fill: #e6edf3; }
    }
    @keyframes m0 {
      0%, 26% { fill: #e6edf3; }
      36%, 85% { fill: #3ddc84; }
      93%, 100% { fill: #e6edf3; }
    }
    @keyframes m1 {
      0%, 26% { transform: translateX(0); fill: #e6edf3; }
      36%, 85% { transform: translateX(-74px); fill: #44dc9c; }
      93%, 100% { transform: translateX(0); fill: #e6edf3; }
    }
    @keyframes m2 {
      0%, 26% { transform: translateX(0); fill: #e6edf3; }
      36%, 85% { transform: translateX(-148px); fill: #4bdbb4; }
      93%, 100% { transform: translateX(0); fill: #e6edf3; }
    }
    @keyframes m3 {
      0%, 26% { transform: translateX(0); fill: #e6edf3; }
      36%, 85% { transform: translateX(-148px); fill: #53dbcb; }
      93%, 100% { transform: translateX(0); fill: #e6edf3; }
    }
    @keyframes m4 {
      0%, 26% { transform: translateX(0); fill: #e6edf3; }
      36%, 85% { transform: translateX(-222px); fill: #5adae3; }
      93%, 100% { transform: translateX(0); fill: #e6edf3; }
    }
    @keyframes m5 {
      0%, 26% { transform: translateX(0); fill: #e6edf3; }
      36%, 85% { transform: translateX(-222px); fill: #61dafb; }
      93%, 100% { transform: translateX(0); fill: #e6edf3; }
    }
    @keyframes cap {
      0%, 36% { opacity: 0; transform: translateX(-16px); }
      41%, 82% { opacity: 1; transform: translateX(0); }
      86%, 100% { opacity: 0; transform: translateX(0); }
    }
    @keyframes blink {
      50% { fill-opacity: 0; }
    }
  </style>

