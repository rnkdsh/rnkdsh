<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title">
  <title id="title">React Weekly: curated React and React Native news, tutorials and jobs, every Sunday. react-weekly.dev, built with TanStack Start, NestJS, Better Auth and AWS SES.</title>
  <defs>
    <radialGradient id="glow" cx="170" cy="30" r="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".2"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="1150" cy="640" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="atom" x1="70" y1="62" x2="130" y2="122" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  </defs>
  <style>
    text { font-family: Geist, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 22px; font-weight: 600; letter-spacing: 3.5px; fill: #f472b6; }
    .title { font-size: 50px; font-weight: 700; fill: #fafafa; }
    .pill { font-size: 21px; font-weight: 600; letter-spacing: 2.5px; fill: #a1a1aa; }
    .lead { font-size: 54px; font-weight: 600; fill: #fafafa; }
    .lead.soft { fill: #a1a1aa; }
    .small { font-size: 30px; fill: #71717a; }
    .foot { font-size: 26px; font-weight: 500; fill: #71717a; }
  </style>

  <rect width="1200" height="630" fill="#09090b"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <rect x="56" y="48" width="88" height="88" rx="22" fill="#18181b" stroke="#27272a" stroke-width="2"/>
  <g fill="none" stroke="url(#atom)" stroke-width="4.5"><ellipse cx="100" cy="92" rx="31" ry="11.5"/><ellipse cx="100" cy="92" rx="31" ry="11.5" transform="rotate(60 100 92)"/><ellipse cx="100" cy="92" rx="31" ry="11.5" transform="rotate(120 100 92)"/></g><circle cx="100" cy="92" r="6" fill="#f472b6"/>
  <text class="eyebrow" x="172" y="82">NEWSLETTER</text>
  <text class="title" x="172" y="130">React Weekly</text>

  <rect x="883" y="64" width="261" height="56" rx="28" fill="#18181b" stroke="#27272a" stroke-width="2"/>
  <circle cx="913" cy="92" r="7" fill="#f472b6"/>
  <text class="pill" x="933" y="100" textLength="183">EVERY SUNDAY</text>

  <rect x="56" y="172" width="1088" height="336" rx="32" fill="#111113" stroke="#27272a" stroke-width="2"/>
  <text class="lead" x="104" y="292">Curated React &amp; React Native</text>
  <text class="lead soft" x="104" y="360">news, tutorials &amp; jobs.</text>
  <text class="small" x="104" y="436">Library updates too, straight to your inbox.</text>

  <text class="foot" x="56" y="578">react-weekly.dev</text>
  <text class="foot" x="1144" y="578" text-anchor="end">TanStack Start · NestJS · Better Auth · AWS SES</text>
</svg>
