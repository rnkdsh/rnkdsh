name: Profile assets

# Builds the images the README loads from the `output` branch:
#   snake.svg, snake-dark.svg   the contribution graph getting eaten
#   year-progress.png           today's card, rendered by yearprogress20xx.app
# Runs daily, on demand, and on every push to master, so the first push creates them.
on:
  schedule:
    - cron: "41 0 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#0891b2
            dist/snake-dark.svg?palette=github-dark&color_snake=#61dafb

      # The app renders this card on every request, which is too slow to embed directly.
      # If the fetch fails the run stops before publishing, so yesterday's images stay up.
      - name: Snapshot the Year Progress card
        run: |
          mkdir -p dist
          curl --fail --silent --show-error --location --retry 3 --retry-delay 10 --max-time 60 \
            --output dist/year-progress.png https://yearprogress20xx.app/opengraph-image

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
